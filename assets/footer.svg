<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient matching the banner -->
    <linearGradient id="footerAzureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2162A3" />
      <stop offset="45%" stop-color="#2D7BC1" />
      <stop offset="100%" stop-color="#4FB6FB" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="footerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="footerTextShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#061c33" flood-opacity="0.35" />
    </filter>

    <!-- Card Rounded Border Clip -->
    <clipPath id="footerRadius">
      <rect x="0" y="0" width="1200" height="120" rx="10" ry="10" />
    </clipPath>
  </defs>

  <style>
    .footer-primary {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', 'Inter', Roboto, sans-serif;
      font-size: 20px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 1.5px;
      text-anchor: middle;
      filter: url(#footerTextShadow);
    }
    .footer-secondary {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', 'Inter', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 500;
      fill: #e0f2fe;
      letter-spacing: 1.2px;
      text-anchor: middle;
      filter: url(#footerTextShadow);
    }
  </style>

  <g clip-path="url(#footerRadius)">
    <!-- Base Background -->
    <rect width="1200" height="120" fill="url(#footerAzureGrad)" />
    <rect width="1200" height="120" fill="url(#footerGlow)" />

    <!-- Top Flow Wave (Translucent Accent) -->
    <path d="M 0,0 
             C 300,28 650,5 950,22 
             C 1080,30 1150,15 1200,8 
             L 1200,0 L 0,0 Z" 
          fill="#ffffff" 
          fill-opacity="0.12" />

    <!-- Bottom Wave (Subtle Depth) -->
    <path d="M 0,95 
             C 280,108 550,88 850,102 
             C 1020,110 1120,98 1200,105 
             L 1200,120 L 0,120 Z" 
          fill="#ffffff" 
          fill-opacity="0.18" />

    <!-- Footer Content -->
    <text x="600" y="52" class="footer-primary">
      <tspan fill="#f59e0b" font-size="20">⚡ </tspan>
      <tspan fill="#ffffff">RISHIKESH SHARMA</tspan>
      <tspan fill="#93c5fd"> · </tspan>
      <tspan fill="#ffffff">CLOUD ARCHITECTURE &amp; ZERO-TRUST DEVSECOPS</tspan>
      <tspan fill="#f59e0b" font-size="20"> ⚡</tspan>
    </text>

    <text x="600" y="82" class="footer-secondary">
      ENTERPRISE LANDING ZONES · AUTONOMOUS AGENTIC AI SRE · FINOPS GOVERNANCE
    </text>
  </g>
</svg>
